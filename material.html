<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>記帳系統 - 深色主題</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    body {
      font-family: sans-serif;
      max-width: 800px;
      margin: 30px auto;
      background-color: #121212;
      color: #e0e0e0;
    }

    .back-button {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 8px 15px;
      background-color: #252525;
      color: #ffffff;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      box-shadow: 0 2px 6px #000000cc;
      transition: background-color 0.3s;
      z-index: 100;
    }
    .back-button:hover {
      background-color: #3a3a3a;
    }

    .main-container {
      position: relative;
      padding-top: 60px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      background-color: #1e1e1e;
      box-shadow: 0 0 10px #000000aa;
      border-radius: 6px;
      overflow: hidden;
      table-layout: fixed;
    }

    th, td {
      border: 1px solid #333;
      padding: 8px;
      text-align: center;
      color: #e0e0e0;
      word-wrap: break-word;
    }

    th {
      background-color: #252525;
      color: #ffffff;
      font-weight: bold;
      box-shadow: inset 0 -2px 3px #000000aa;
    }

    th:nth-child(1), td:nth-child(1) { width: 15%; }
    th:nth-child(2), td:nth-child(2) { width: 15%; }
    th:nth-child(3), td:nth-child(3) { width: 15%; }
    th:nth-child(4), td:nth-child(4) { width: 25%; }
    th:nth-child(5), td:nth-child(5) { width: 30%; }

    button {
      margin: 5px;
      padding: 6px 12px;
      background-color: #252525;
      color: #e0e0e0;
      border: 1px solid #333;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 2px 6px #000000cc;
      transition: background-color 0.3s, box-shadow 0.3s;
    }
    button:hover {
      background-color: #3a3a3a;
      box-shadow: 0 4px 12px #000000ee;
    }

    select, input[type="date"], input[type="number"], input[type="text"] {
      margin: 5px;
      padding: 6px;
      background-color: #2d2d2d;
      color: #e0e0e0;
      border: 1px solid #333;
      border-radius: 5px;
      box-shadow: inset 0 0 5px #000000cc;
    }

    select:focus, input:focus {
      outline: none;
      border-color: #4b6cb7;
      box-shadow: 0 0 6px #4b6cb7aa;
      background-color: #2d2d2d;
      color: #e0e0e0;
    }

    .filter-toggle, .type-filter {
      margin: 15px 0 5px;
      text-align: center;
    }
    .filter-toggle button, .type-filter button {
      margin: 0 10px;
      padding: 8px 20px;
      font-weight: bold;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background-color: #333333;
      color: #b0b0b0;
      box-shadow: 0 2px 6px #000000cc;
      transition: background-color 0.3s, color 0.3s;
    }
    .filter-toggle button.active, .type-filter button.active {
      background-color: #4b6cb7;
      color: #ffffff;
      box-shadow: 0 4px 12px #274a9dcc;
    }
    .filter-toggle button:hover:not(.active), .type-filter button:hover:not(.active) {
      background-color: #444444;
      color: #e0e0e0;
    }

    .date-selector {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 15px 0;
      gap: 10px;
    }
    
    .date-selector label {
      color: #b0b0b0;
      white-space: nowrap;
    }
    
    .date-selector input[type="date"],
    .date-selector input[type="month"] {
      padding: 8px;
      border-radius: 5px;
      background-color: #2d2d2d;
      border: 1px solid #333;
      color: #e0e0e0;
    }

    #editModal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(18,18,18,0.9);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #editModal > div {
      background: #252525;
      padding: 20px;
      border-radius: 8px;
      width: 320px;
      box-sizing: border-box;
      box-shadow: 0 8px 20px #000000cc;
      color: #e0e0e0;
    }
    #editModal h3 {
      margin-top: 0;
      color: #ffffff;
    }
    #editForm label {
      display: block;
      margin-bottom: 10px;
      color: #b0b0b0;
    }
    #editForm input, #editForm select {
      width: 100%;
      padding: 6px;
      background-color: #2d2d2d;
      border: 1px solid #333;
      border-radius: 5px;
      color: #e0e0e0;
      box-shadow: inset 0 0 5px #000000cc;
      box-sizing: border-box;
    }
    #editForm div {
      text-align: right;
    }
    #editForm button {
      padding: 6px 12px;
      margin-left: 10px;
      cursor: pointer;
      background-color: #333;
      border: 1px solid #444;
      color: #e0e0e0;
      box-shadow: 0 2px 6px #000000cc;
      transition: background-color 0.3s;
    }
    #editForm button:hover {
      background-color: #4b6cb7;
      border-color: #3a56a0;
      box-shadow: 0 4px 12px #274a9dcc;
      color: #fff;
    }
    
    .summary {
      margin: 15px 0;
      padding: 10px;
      background-color: #1e1e1e;
      border-radius: 5px;
      display: flex;
      justify-content: space-around;
      box-shadow: 0 2px 6px #000000cc;
    }
    .summary-item {
      text-align: center;
    }
    .summary-label {
      color: #b0b0b0;
      font-size: 0.9em;
    }
    .summary-value {
      font-size: 1.2em;
      font-weight: bold;
      margin-top: 5px;
    }
    .income {
      color: #4CAF50;
    }
    .expense {
      color: #F44336;
    }
    .balance {
      color: #2196F3;
    }

    .category-tag {
      display: inline-block;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.8em;
      background-color: #4b6cb7;
      color: white;
    }

    .add-record-btn {
      display: block;
      width: 120px;
      margin: 20px auto;
      padding: 10px;
      background-color: #4b6cb7;
      color: white;
      text-align: center;
      border-radius: 5px;
      font-weight: bold;
      box-shadow: 0 2px 6px #000000cc;
      transition: background-color 0.3s;
    }
    .add-record-btn:hover {
      background-color: #3a56a0;
    }
  </style>
</head>
<body>
  <a href="index.html" class="back-button">← 返回</a>

  <div class="main-container">
    <h2 style="color:#ffffff; text-align: center;">記帳系統</h2>

    <a href="#" id="addRecordBtn" class="add-record-btn">＋ 新增記錄</a>

    <div class="filter-toggle">
      <button id="btnMonth" class="active">按月查看</button>
      <button id="btnDay">按日查看</button>
    </div>

    <div class="type-filter">
      <button id="btnAll" class="active">全部記錄</button>
      <button id="btnIncome">僅收入</button>
      <button id="btnExpense">僅支出</button>
    </div>

    <div class="date-selector">
      <label id="dateLabel" for="dateInput">選擇月份：</label>
      <input type="month" id="dateInput" />
    </div>

    <div class="summary">
      <div class="summary-item">
        <div class="summary-label">收入總計</div>
        <div class="summary-value income" id="totalIncome">NT$ 0.00</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">支出總計</div>
        <div class="summary-value expense" id="totalExpense">NT$ 0.00</div>
      </div>
      <div class="summary-item">
        <div class="summary-label">結餘</div>
        <div class="summary-value balance" id="totalBalance">NT$ 0.00</div>
      </div>
    </div>

    <table>
      <thead>
        <tr>
          <th>日期</th>
          <th>類型</th>
          <th>金額</th>
          <th>備註</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="recordsTableBody"></tbody>
    </table>
  </div>

  <div id="editModal">
    <div>
      <h3 id="modalTitle">編輯記錄</h3>
      <form id="editForm">
        <label>
          日期 (YYYY-MM-DD)<br />
          <input type="date" id="editDate" required />
        </label>
        <label>
          類型<br />
          <select id="editType" required>
            <option value="income">收入</option>
            <option value="expense">支出</option>
          </select>
        </label>
        <label>
          分類<br />
          <select id="editCategory">
            <option value="">無分類</option>
          </select>
        </label>
        <label>
          金額<br />
          <input type="number" id="editAmount" min="0" step="0.01" required />
        </label>
        <label>
          備註<br />
          <input type="text" id="editNote" />
        </label>
        <div>
          <button type="button" id="editCancelBtn">取消</button>
          <button type="submit">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyDEOsfYrAGpAnYsiYyBpaYCC-EFL9dnL6k",
      authDomain: "project-1743045136631756226.firebaseapp.com",
      projectId: "project-1743045136631756226",
      storageBucket: "project-1743045136631756226.appspot.com",
      messagingSenderId: "660576126542",
      appId: "1:660576126542:web:ff0f574ec65385b7fa251f",
      measurementId: "G-31VC1RK1HK"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 分類選項
    const categoryOptions = {
      expense: [
        { value: "飲食", text: "飲食" },
        { value: "交通", text: "交通" },
        { value: "娛樂", text: "娛樂" },
        { value: "購物", text: "購物" },
        { value: "個人", text: "個人" },
        { value: "醫療", text: "醫療" },
        { value: "居家", text: "居家" },
        { value: "家庭", text: "家庭" },
        { value: "生活", text: "生活" },
        { value: "學習", text: "學習" },
        { value: "還款", text: "還款" },
        { value: "其他支出", text: "其他支出" }
      ],
      income: [
        { value: "薪資", text: "薪資" },
        { value: "獎金", text: "獎金" },
        { value: "投資", text: "投資" },
        { value: "還款", text: "還款" },
        { value: "彩券", text: "彩券" },
        { value: "利息", text: "利息" },
        { value: "其他收入", text: "其他收入" }
      ]
    };

    // 全域變數
    let allData = [];
    let currentFilter = 'month';
    let currentTypeFilter = 'all';
    let editingId = null;
    let isAddingNew = false;

    // 元素
    const btnMonth = document.getElementById("btnMonth");
    const btnDay = document.getElementById("btnDay");
    const btnAll = document.getElementById("btnAll");
    const btnIncome = document.getElementById("btnIncome");
    const btnExpense = document.getElementById("btnExpense");
    const dateLabel = document.getElementById("dateLabel");
    const dateInput = document.getElementById("dateInput");
    const recordsTableBody = document.getElementById("recordsTableBody");
    const totalIncome = document.getElementById("totalIncome");
    const totalExpense = document.getElementById("totalExpense");
    const totalBalance = document.getElementById("totalBalance");
    const addRecordBtn = document.getElementById("addRecordBtn");

    const editModal = document.getElementById("editModal");
    const modalTitle = document.getElementById("modalTitle");
    const editForm = document.getElementById("editForm");
    const editDate = document.getElementById("editDate");
    const editType = document.getElementById("editType");
    const editCategory = document.getElementById("editCategory");
    const editAmount = document.getElementById("editAmount");
    const editNote = document.getElementById("editNote");
    const editCancelBtn = document.getElementById("editCancelBtn");

    // 更新分類選項
    function updateCategoryOptions(type) {
      editCategory.innerHTML = '<option value="">無分類</option>';
      const options = categoryOptions[type] || [];
      
      options.forEach(option => {
        const opt = document.createElement('option');
        opt.value = option.value;
        opt.textContent = option.text;
        editCategory.appendChild(opt);
      });
    }

    // 載入資料
    async function loadData() {
      try {
        const snapshot = await db.collection("records").get();
        allData = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data()
        }));
        allData.sort((a, b) => b.date.localeCompare(a.date));
        updateSummary();
        renderTable();
      } catch (err) {
        alert("讀取資料失敗：" + err.message);
      }
    }

    // 更新統計資訊
    function updateSummary(filteredData) {
      const data = filteredData || allData;
      
      const income = data
        .filter(item => item.type === 'income')
        .reduce((sum, item) => sum + item.amount, 0);
      
      const expense = data
        .filter(item => item.type === 'expense')
        .reduce((sum, item) => sum + item.amount, 0);
      
      const balance = income - expense;
      
      totalIncome.textContent = `NT$ ${income.toFixed(2)}`;
      totalExpense.textContent = `NT$ ${expense.toFixed(2)}`;
      totalBalance.textContent = `NT$ ${balance.toFixed(2)}`;
    }

    // 渲染表格
    function renderTable() {
      const filterVal = dateInput.value;
      let filtered = [...allData];

      if (currentTypeFilter !== 'all') {
        filtered = filtered.filter(d => d.type === currentTypeFilter);
      }

      if (filterVal) {
        if (currentFilter === 'month') {
          const yearMonth = filterVal.slice(0, 7);
          filtered = filtered.filter(d => d.date.startsWith(yearMonth));
        } else {
          filtered = filtered.filter(d => d.date === filterVal);
        }
      }

      updateSummary(filtered);

      recordsTableBody.innerHTML = "";

      if (filtered.length === 0) {
        const tr = document.createElement("tr");
        tr.innerHTML = `<td colspan="5" style="text-align: center;">沒有找到記錄</td>`;
        recordsTableBody.appendChild(tr);
        return;
      }

      filtered.forEach(item => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${item.date}</td>
          <td>
            ${item.type === 'income' ? '收入' : '支出'}
            ${item.category ? `<span class="category-tag">${item.category}</span>` : ''}
          </td>
          <td>${item.amount.toFixed(2)}</td>
          <td>${item.note || ''}</td>
          <td>
            <button class="edit-btn" data-id="${item.id}">編輯</button>
            <button class="delete-btn" data-id="${item.id}">刪除</button>
          </td>
        `;
        recordsTableBody.appendChild(tr);
      });

      document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.addEventListener("click", async e => {
          const id = e.target.dataset.id;
          if (confirm("確定刪除此筆資料？")) {
            try {
              await db.collection("records").doc(id).delete();
              alert("刪除成功");
              await loadData();
            } catch (err) {
              alert("刪除失敗：" + err.message);
            }
          }
        });
      });

      document.querySelectorAll(".edit-btn").forEach(btn => {
        btn.addEventListener("click", e => {
          const id = e.target.dataset.id;
          openEditModal(id);
        });
      });
    }

    function openEditModal(id) {
      isAddingNew = false;
      modalTitle.textContent = "編輯記錄";
      
      const item = allData.find(d => d.id === id);
      if (!item) return alert("找不到該筆資料");
      
      editingId = id;
      editDate.value = item.date;
      editType.value = item.type;
      editCategory.value = item.category || "";
      editAmount.value = item.amount;
      editNote.value = item.note || "";
      editModal.style.display = "flex";
      
      updateCategoryOptions(item.type);
    }

    function openAddModal() {
      isAddingNew = true;
      modalTitle.textContent = "新增記錄";
      editingId = null;
      
      // 設置日期為當天
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      
      editDate.value = `${year}-${month}-${day}`;
      editType.value = "expense";
      editCategory.value = "";
      editAmount.value = "";
      editNote.value = "";
      editModal.style.display = "flex";
      
      updateCategoryOptions(editType.value);
    }

    function closeEditModal() {
      editingId = null;
      isAddingNew = false;
      editModal.style.display = "none";
      editForm.reset();
    }

    editType.addEventListener("change", function() {
      updateCategoryOptions(this.value);
    });

    btnMonth.addEventListener("click", () => {
      currentFilter = 'month';
      btnMonth.classList.add("active");
      btnDay.classList.remove("active");
      dateLabel.textContent = "選擇月份：";
      dateInput.type = "month";
      renderTable();
    });
    
    btnDay.addEventListener("click", () => {
      currentFilter = 'day';
      btnDay.classList.add("active");
      btnMonth.classList.remove("active");
      dateLabel.textContent = "選擇日期：";
      dateInput.type = "date";
      renderTable();
    });

    btnAll.addEventListener("click", () => {
      currentTypeFilter = 'all';
      btnAll.classList.add("active");
      btnIncome.classList.remove("active");
      btnExpense.classList.remove("active");
      renderTable();
    });
    
    btnIncome.addEventListener("click", () => {
      currentTypeFilter = 'income';
      btnIncome.classList.add("active");
      btnAll.classList.remove("active");
      btnExpense.classList.remove("active");
      renderTable();
    });
    
    btnExpense.addEventListener("click", () => {
      currentTypeFilter = 'expense';
      btnExpense.classList.add("active");
      btnAll.classList.remove("active");
      btnIncome.classList.remove("active");
      renderTable();
    });

    dateInput.addEventListener("change", () => {
      renderTable();
    });

    addRecordBtn.addEventListener("click", () => {
      openAddModal();
    });

    editCancelBtn.addEventListener("click", () => {
      closeEditModal();
    });

    editForm.addEventListener("submit", async e => {
      e.preventDefault();
      
      const recordData = {
        date: editDate.value,
        type: editType.value,
        category: editCategory.value || null,
        amount: parseFloat(editAmount.value),
        note: editNote.value || null,
      };

      try {
        if (isAddingNew) {
          await db.collection("records").add(recordData);
          alert("✅ 新增成功");
        } else {
          if (!editingId) return alert("編輯時發生錯誤，找不到資料ID");
          await db.collection("records").doc(editingId).update(recordData);
          alert("✅ 編輯成功");
        }
        
        closeEditModal();
        await loadData();
      } catch (err) {
        alert("操作失敗：" + err.message);
      }
    });

    // 初始化載入
    (async function init() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      dateInput.value = `${year}-${month}`;
      
      await loadData();
      
      editType.addEventListener("change", function() {
        updateCategoryOptions(this.value);
      });
    })();
  </script>
</body>
</html>
