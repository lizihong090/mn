<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>記帳系統 - 深色主題</title>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* [之前的CSS樣式保持不變...] */

    /* 新增項目選擇框樣式 */
    .category-select {
      width: 100%;
      padding: 8px;
      background-color: #2d2d2d;
      border: 1px solid #333;
      border-radius: 5px;
      color: #e0e0e0;
      box-shadow: inset 0 0 5px #000000cc;
    }
  </style>
</head>
<body>
  <!-- [之前的HTML結構保持不變...] -->

  <div class="main-container">
    <h2 style="color:#ffffff; text-align: center;">記帳系統</h2>

    <!-- 新增記錄表單 -->
    <div class="add-record-form">
      <h3><i class="fas fa-plus-circle"></i> 新增記錄</h3>
      <form id="addRecordForm">
        <div class="form-row">
          <div class="form-group">
            <label for="newDate">日期</label>
            <input type="date" id="newDate" required />
          </div>
          
          <div class="form-group">
            <label for="newType">類型</label>
            <select id="newType" required>
              <option value="income">收入</option>
              <option value="expense" selected>支出</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="newCategory">項目</label>
            <select id="newCategory" class="category-select" required>
              <option value="">請選擇項目</option>
              <!-- 項目選項將由JavaScript動態生成 -->
            </select>
          </div>
          
          <div class="form-group">
            <label for="newAmount">金額</label>
            <input type="number" id="newAmount" min="0" step="0.01" required />
          </div>
        </div>
        
        <div class="form-row">
          <div class="form-group" style="flex: 2;">
            <label for="newNote">備註</label>
            <input type="text" id="newNote" placeholder="輸入交易備註..." />
          </div>
        </div>
        
        <div class="form-actions">
          <button type="submit"><i class="fas fa-save"></i> 儲存記錄</button>
        </div>
      </form>
    </div>

    <!-- [其餘HTML結構保持不變...] -->

    <table>
      <thead>
        <tr>
          <th>日期</th>
          <th>類型</th>
          <th>項目</th>
          <th>金額</th>
          <th>備註</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="recordsTableBody"></tbody>
    </table>
  </div>

  <!-- 編輯彈窗 Modal -->
  <div id="editModal">
    <div>
      <h3>編輯記錄</h3>
      <form id="editForm">
        <label>
          日期 (YYYY-MM-DD)<br />
          <input type="date" id="editDate" required />
        </label>
        <label>
          類型<br />
          <select id="editType" required>
            <option value="income">收入</option>
            <option value="expense">支出</option>
          </select>
        </label>
        <label>
          項目<br />
          <select id="editCategory" class="category-select" required>
            <option value="">請選擇項目</option>
            <!-- 項目選項將由JavaScript動態生成 -->
          </select>
        </label>
        <label>
          金額<br />
          <input type="number" id="editAmount" min="0" step="0.01" required />
        </label>
        <label>
          備註<br />
          <input type="text" id="editNote" />
        </label>
        <div>
          <button type="button" id="editCancelBtn">取消</button>
          <button type="submit">儲存</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // Firebase 設定
    const firebaseConfig = {
      apiKey: "AIzaSyDEOsfYrAGpAnYsiYyBpaYCC-EFL9dnL6k",
      authDomain: "project-1743045136631756226.firebaseapp.com",
      projectId: "project-1743045136631756226",
      storageBucket: "project-1743045136631756226.firebasestorage.app",
      messagingSenderId: "660576126542",
      appId: "1:660576126542:web:ff0f574ec65385b7fa251f",
      measurementId: "G-31VC1RK1HK"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 項目分類
    const categories = {
      income: [
        { value: "salary", text: "薪資" },
        { value: "bonus", text: "獎金" },
        { value: "investment", text: "投資收益" },
        { value: "other_income", text: "其他收入" }
      ],
      expense: [
        { value: "food", text: "飲食" },
        { value: "transportation", text: "交通" },
        { value: "entertainment", text: "娛樂" },
        { value: "shopping", text: "購物" },
        { value: "housing", text: "居住" },
        { value: "education", text: "教育" },
        { value: "medical", text: "醫療" },
        { value: "other_expense", text: "其他支出" }
      ]
    };

    // 全域變數
    let allData = [];
    let currentFilter = 'month'; // month 或 day
    let currentTypeFilter = 'all'; // all, income, expense
    let editingId = null;

    // 元素
    const btnMonth = document.getElementById("btnMonth");
    const btnDay = document.getElementById("btnDay");
    const btnAll = document.getElementById("btnAll");
    const btnIncome = document.getElementById("btnIncome");
    const btnExpense = document.getElementById("btnExpense");
    const dateLabel = document.getElementById("dateLabel");
    const dateInput = document.getElementById("dateInput");
    const recordsTableBody = document.getElementById("recordsTableBody");
    const totalIncome = document.getElementById("totalIncome");
    const totalExpense = document.getElementById("totalExpense");
    const totalBalance = document.getElementById("totalBalance");

    // 新增表單元素
    const addRecordForm = document.getElementById("addRecordForm");
    const newDate = document.getElementById("newDate");
    const newType = document.getElementById("newType");
    const newCategory = document.getElementById("newCategory");
    const newAmount = document.getElementById("newAmount");
    const newNote = document.getElementById("newNote");

    // 編輯彈窗元素
    const editModal = document.getElementById("editModal");
    const editForm = document.getElementById("editForm");
    const editDate = document.getElementById("editDate");
    const editType = document.getElementById("editType");
    const editCategory = document.getElementById("editCategory");
    const editAmount = document.getElementById("editAmount");
    const editNote = document.getElementById("editNote");
    const editCancelBtn = document.getElementById("editCancelBtn");

    // 載入項目選項
    function loadCategoryOptions(selectElement, type) {
      selectElement.innerHTML = '<option value="">請選擇項目</option>';
      const categoryList = categories[type] || [];
      
      categoryList.forEach(category => {
        const option = document.createElement("option");
        option.value = category.value;
        option.textContent = category.text;
        selectElement.appendChild(option);
      });
    }

    // 類型變更時更新項目選項
    newType.addEventListener("change", () => {
      loadCategoryOptions(newCategory, newType.value);
    });

    editType.addEventListener("change", () => {
      loadCategoryOptions(editCategory, editType.value);
    });

    // 載入資料
    async function loadData() {
      try {
        const snapshot = await db.collection("records").get();
        allData = snapshot.docs.map(doc => ({
          id: doc.id,
          ...doc.data(),
          amount: parseFloat(doc.data().amount) // 確保金額是數字
        }));
        // 載入後按日期排序 (最新在上)
        allData.sort((a, b) => b.date.localeCompare(a.date));
        updateSummary();
      } catch (err) {
        alert("讀取資料失敗：" + err.message);
      }
    }

    // 更新統計資訊
    function updateSummary(filteredData) {
      const data = filteredData || allData;
      
      const income = data
        .filter(item => item.type === 'income')
        .reduce((sum, item) => sum + item.amount, 0);
      
      const expense = data
        .filter(item => item.type === 'expense')
        .reduce((sum, item) => sum + item.amount, 0);
      
      const balance = income - expense;
      
      totalIncome.textContent = `NT$ ${income.toFixed(2)}`;
      totalExpense.textContent = `NT$ ${expense.toFixed(2)}`;
      totalBalance.textContent = `NT$ ${balance.toFixed(2)}`;
    }

    // 渲染表格
    function renderTable() {
      const filterVal = dateInput.value;
      let filtered = [...allData]; // 創建副本以保持原始排序

      // 篩選類型
      if (currentTypeFilter !== 'all') {
        filtered = filtered.filter(d => d.type === currentTypeFilter);
      }

      // 篩選日期
      if (filterVal) {
        if (currentFilter === 'month') {
          const yearMonth = filterVal.slice(0, 7);
          filtered = filtered.filter(d => d.date.startsWith(yearMonth));
        } else {
          filtered = filtered.filter(d => d.date === filterVal);
        }
      }

      // 更新統計資訊
      updateSummary(filtered);

      // 清空表格
      recordsTableBody.innerHTML = "";

      // 顯示資料 (已按日期排序，最新在上)
      filtered.forEach(item => {
        const tr = document.createElement("tr");
        // 查找項目名稱
        const categoryType = item.type === 'income' ? 'income' : 'expense';
        const categoryObj = categories[categoryType].find(c => c.value === item.category) || { text: item.category || '未分類' };
        
        tr.innerHTML = `
          <td>${item.date}</td>
          <td>${item.type === 'income' ? '收入' : '支出'}</td>
          <td>${categoryObj.text}</td>
          <td>${item.amount.toFixed(2)}</td>
          <td>${item.note || ''}</td>
          <td>
            <button class="edit-btn" data-id="${item.id}">編輯</button>
            <button class="delete-btn" data-id="${item.id}">刪除</button>
          </td>
        `;
        recordsTableBody.appendChild(tr);
      });

      // 刪除按鈕監聽
      document.querySelectorAll(".delete-btn").forEach(btn => {
        btn.addEventListener("click", async e => {
          const id = e.target.dataset.id;
          if (confirm("確定刪除此筆資料？")) {
            try {
              await db.collection("records").doc(id).delete();
              alert("刪除成功");
              await loadData();
              renderTable();
            } catch (err) {
              alert("刪除失敗：" + err.message);
            }
          }
        });
      });

      // 編輯按鈕監聽
      document.querySelectorAll(".edit-btn").forEach(btn => {
        btn.addEventListener("click", e => {
          const id = e.target.dataset.id;
          openEditModal(id);
        });
      });
    }

    function openEditModal(id) {
      const item = allData.find(d => d.id === id);
      if (!item) return alert("找不到該筆資料");
      editingId = id;
      editDate.value = item.date;
      editType.value = item.type;
      loadCategoryOptions(editCategory, item.type);
      editCategory.value = item.category || "";
      editAmount.value = item.amount;
      editNote.value = item.note || "";
      editModal.style.display = "flex";
    }

    function closeEditModal() {
      editingId = null;
      editModal.style.display = "none";
      editForm.reset();
    }

    // [其餘事件監聽器保持不變...]

    // 新增記錄表單提交
    addRecordForm.addEventListener("submit", async e => {
      e.preventDefault();
      
      const recordData = {
        date: newDate.value,
        type: newType.value,
        category: newCategory.value,
        amount: parseFloat(newAmount.value),
        note: newNote.value,
        createdAt: new Date().toISOString()
      };
      
      try {
        // 新增記錄到Firestore
        await db.collection("records").add(recordData);
        
        // 顯示成功訊息
        alert("✅ 記錄新增成功！");
        
        // 重置表單
        addRecordForm.reset();
        newType.value = "expense"; // 重置後仍保持支出選項
        loadCategoryOptions(newCategory, "expense"); // 重置項目選項
        
        // 重新載入資料並更新表格
        await loadData();
        renderTable();
      } catch (err) {
        alert("❌ 新增失敗：" + err.message);
        console.error(err);
      }
    });

    // 編輯表單送出
    editForm.addEventListener("submit", async e => {
      e.preventDefault();
      if (!editingId) return alert("編輯時發生錯誤，找不到資料ID");

      const updatedData = {
        date: editDate.value,
        type: editType.value,
        category: editCategory.value,
        amount: parseFloat(editAmount.value),
        note: editNote.value,
      };

      try {
        await db.collection("records").doc(editingId).update(updatedData);
        alert("✅ 編輯成功");
        closeEditModal();
        await loadData();
        renderTable();
      } catch (err) {
        alert("更新失敗：" + err.message);
      }
    });

    // 初始化載入
    (async function init() {
      // 設置日期選擇器為當前月份
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      
      dateInput.value = `${year}-${month}`;
      newDate.value = `${year}-${month}-${day}`; // 設置新增表單的日期為今天
      
      // 初始化項目選項
      loadCategoryOptions(newCategory, "expense");
      
      await loadData();
      renderTable();
    })();
  </script>
</body>
</html>
